name: CI

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @mcptoolshop/voice-soundboard-core build

      - name: Test core
        run: pnpm --filter @mcptoolshop/voice-soundboard-core test

      - name: Build MCP server
        run: pnpm --filter @mcptoolshop/voice-soundboard-mcp build

      - name: Test MCP server
        run: pnpm --filter @mcptoolshop/voice-soundboard-mcp test

  node-smoke:
    runs-on: ubuntu-latest
    needs: node-test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Type-check MCP server
        run: pnpm --filter @mcptoolshop/voice-soundboard-mcp exec tsc --noEmit

      - name: npm pack dry-run (core)
        run: cd packages/core && npm pack --dry-run

      - name: npm pack dry-run (mcp-server)
        run: cd packages/mcp-server && npm pack --dry-run
